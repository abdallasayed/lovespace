name: Flutter Build with MultiDex

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.19.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        cache-key: flutter-cache
    
    - name: Clean and get packages
      run: |
        flutter clean
        flutter pub get
    
    - name: Create Android project structure
      run: |
        # ⬆️ أضف الكود من الخطوة 1 هنا
    
    - name: Configure MultiDex
      run: |
        echo "⚙️ تكوين MultiDex..."
        
        GRADLE_FILE="android/app/build.gradle"
        
        if grep -q "defaultConfig" "$GRADLE_FILE"; then
          if ! grep -q "multiDexEnabled true" "$GRADLE_FILE"; then
            sed -i '/defaultConfig {/a\        multiDexEnabled true' "$GRADLE_FILE"
          fi
        fi
        
        if ! grep -q "androidx.multidex:multidex" "$GRADLE_FILE"; then
          sed -i "/dependencies {/a\    implementation 'androidx.multidex:multidex:2.0.1'" "$GRADLE_FILE"
        fi
        
        echo "✅ تم تكوين MultiDex"
    
    - name: Accept Android licenses
      run: |
        yes | sdkmanager --licenses || true
        flutter doctor --android-licenses
    
    - name: Build Debug APK
      run: |
        echo "🔨 بناء APK للتطوير..."
        flutter build apk --debug --no-shrink
    
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: apk-builds
        path: |
          build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 7
