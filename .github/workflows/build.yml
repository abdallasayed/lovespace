name: Flutter Build with MultiDex

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.19.0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        cache-key: flutter-cache
    
    - name: Clean and get packages
      run: |
        flutter clean
        flutter pub get
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Configure MultiDex
      run: |
        # طريقة آمنة لتمكين MultiDex
        echo "⚙️ تكوين MultiDex..."
        
        # ملف Gradle
        GRADLE_FILE="android/app/build.gradle"
        
        # تمكين multiDexEnabled
        if grep -q "defaultConfig" "$GRADLE_FILE"; then
          if ! grep -q "multiDexEnabled true" "$GRADLE_FILE"; then
            sed -i '/defaultConfig {/a\        multiDexEnabled true' "$GRADLE_FILE"
          fi
        fi
        
        # إضافة dependency
        if ! grep -q "androidx.multidex:multidex" "$GRADLE_FILE"; then
          sed -i "/dependencies {/a\    implementation 'androidx.multidex:multidex:2.0.1'" "$GRADLE_FILE"
        fi
        
        echo "✅ تم تكوين MultiDex"
    
    - name: Accept Android licenses
      run: |
        yes | sdkmanager --licenses || true
        flutter doctor --android-licenses
    
    - name: Build Debug APK
      run: |
        echo "🔨 بناء APK للتطوير..."
        flutter build apk --debug --no-shrink
    
    - name: Build Release APK
      run: |
        echo "🔨 بناء APK للإنتاج..."
        flutter build apk --release \
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
          --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
          --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
          --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
          --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
    
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: apk-builds
        path: |
          build/app/outputs/flutter-apk/app-debug.apk
          build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7
    
    - name: Upload build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          flutter.log
        retention-days: 30
