name: Flutter CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        
    - name: Install dependencies
      run: |
        flutter clean
        flutter pub get
        
    - name: Enable MultiDex support
      run: |
        chmod +x scripts/enable_multidex.sh
        ./scripts/enable_multidex.sh
        
    - name: Sync Flutter with Android
      run: |
        flutter pub get
        cd android
        ./gradlew app:dependencies
        
    - name: Build with MultiDex
      run: |
        # محاولة البناء مع MultiDex
        if flutter build apk --debug; then
          echo "✅ البناء نجح مع MultiDex"
        else
          echo "⚠️  فشل البناء، جرب الطريقة اليدوية..."
          # الطريقة الاحتياطية
          cd android
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace
        fi
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: built-apks
        path: build/app/outputs/flutter-apk/
